<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tend</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tend">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --paper:#ffffff; --ink:#000000; --leaf:#17663d; --leaf-ink:#ffffff; --leaf-soft:#e8f2eb;
  --line:#dde4df; --mute:#5a645e;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#000000; --ink:#ffffff; --leaf:#62c48a; --leaf-ink:#000000; --leaf-soft:#0f2519;
    --line:#27312b; --mute:#9aa59f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#000000; --ink:#ffffff; --leaf:#62c48a; --leaf-ink:#000000; --leaf-soft:#0f2519;
  --line:#27312b; --mute:#9aa59f; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5;font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px;border-radius:6px}
.app{max-width:620px;margin:0 auto;padding:16px 20px calc(104px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:12px 0 20px}
.hero{font-size:clamp(60px,18vw,104px);line-height:.86;font-weight:800;letter-spacing:-.05em;margin:0;font-variation-settings:"opsz" 96}
.page{font-size:44px;line-height:1;font-weight:750;letter-spacing:-.035em;margin:0}
.sub{color:var(--mute);margin:10px 0 0;font-size:15.5px;max-width:46ch}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);flex:none}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:600;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.leaf{background:var(--leaf);color:var(--leaf-ink)}
.btn.small{min-height:38px;padding:0 16px;font-size:14.5px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.link{color:var(--leaf);font-weight:600;font-size:14.5px;text-decoration:underline;text-underline-offset:3px}
.sec{font-size:23px;font-weight:700;letter-spacing:-.02em;margin:34px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec2{font-size:17px;font-weight:650;margin:22px 0 6px;color:var(--mute)}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .main{flex:1;min-width:0;display:flex;align-items:center;gap:14px}
.row .txt{min-width:0;display:block}
.row .t{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--mute);font-size:14px;display:block}
.row .how{display:block;font-size:14px;margin-top:4px}
.row.top-al{align-items:flex-start}
.od{color:var(--ink);font-weight:650}
.thumb{width:50px;height:50px;border-radius:50%;object-fit:cover;background:var(--leaf-soft);flex:none;display:grid;place-items:center;color:var(--leaf);font-weight:750;font-size:19px}
.check{width:42px;height:42px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink);display:grid;place-items:center;flex:none;color:var(--line)}
.check:hover{color:var(--mute)}
.check:active{background:var(--leaf);color:var(--leaf-ink);box-shadow:none}
.x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--mute);flex:none}
.sp{font-family:"Instrument Serif",Georgia,"Times New Roman",serif;font-style:italic;font-size:1.1em;letter-spacing:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tag{display:inline-block;font-size:13.5px;padding:3px 11px;border-radius:999px;background:var(--leaf-soft)}
.note{background:var(--leaf-soft);border-radius:16px;padding:12px 15px;font-size:15px;margin:14px 0}
.note.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}
.muted{color:var(--mute)}
.small{font-size:14px}
.pre{white-space:pre-wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:26px 16px}
.tile{display:flex;flex-direction:column;gap:1px;min-width:0}
.tile .tn{font-weight:650;font-size:17px;line-height:1.2;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .ts{color:var(--mute);font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tx{font-size:14px;color:var(--mute);margin-top:3px}
.tile .tx.due{color:var(--leaf);font-weight:650}
.ringwrap{position:relative;width:100%;aspect-ratio:1;display:block}
.ringwrap img,.ringwrap .ph{position:absolute;left:9%;top:9%;width:82%;height:82%;border-radius:50%;object-fit:cover;background:var(--leaf-soft)}
.ringwrap .ph{display:grid;place-items:center;font-size:38px;font-weight:800;color:var(--leaf)}
.ringwrap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .arc{transition:stroke-dasharray .9s cubic-bezier(.2,.7,.2,1)}
.phero{width:min(280px,72vw);margin:4px 0 18px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;font-size:12px;color:var(--mute);text-align:center}
.tab[aria-current="page"]{color:var(--ink);font-weight:650}
.tab[aria-current="page"] .ico{stroke:var(--leaf);stroke-width:2.2}
.sheet{position:fixed;inset:0;background:var(--paper);z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 12px) 20px calc(env(safe-area-inset-bottom,0px) + 48px)}
.sheet[hidden]{display:none}
.sheet .in{max-width:620px;margin:0 auto}
.shead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;min-height:44px}
.shead h2{margin:0;font-size:18px;font-weight:650}
label.f{display:block;margin:16px 0}
label.f>span,.flabel{display:block;font-size:14.5px;color:var(--mute);margin-bottom:7px}
.field{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--paper)}
textarea.field{min-height:96px;resize:vertical}
.field:focus{border-color:var(--ink);outline:none}
.seg{display:inline-flex;flex-wrap:wrap;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--ink);overflow:hidden}
.seg button{padding:10px 17px;font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--ink);border-radius:24px;min-height:230px;width:100%;text-align:center;padding:24px;cursor:pointer}
.drop .big{font-size:22px;font-weight:700;letter-spacing:-.01em}
.shots{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.shot{position:relative}
.shot img{width:100px;height:100px;border-radius:16px;object-fit:cover;display:block}
.shot .x{position:absolute;top:4px;right:4px;background:var(--paper);width:30px;height:30px}
.addshot{width:100px;height:100px;border-radius:16px;border:1.5px dashed var(--ink);display:grid;place-items:center;cursor:pointer}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:46px;height:46px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:650;font-size:14px}
.days button[aria-pressed="true"]{background:var(--leaf);box-shadow:none;color:var(--leaf-ink)}
.plan{border-top:1px solid var(--line)}
.prow{padding:14px 0;border-bottom:1px solid var(--line)}
.prow .pl{font-weight:650}
.nums{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;align-items:center}
.nums label{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--mute)}
.nums input{width:74px;min-height:42px;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--paper);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:12.5px;color:var(--mute);padding-bottom:4px}
.cal .d{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15.5px;position:relative}
.cal .d.care{background:var(--leaf-soft)}
.cal .d.out{opacity:.32}
.cal .d.today{font-weight:800}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dot.water{background:var(--leaf)}
.dot.feed{background:var(--ink)}
.dot.other{box-shadow:inset 0 0 0 1.5px var(--ink)}
.dot.past{opacity:.4}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--mute);margin:12px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.monthbar strong{font-size:20px;letter-spacing:-.01em}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 8px 10px 18px;border-radius:999px;font-size:14.5px;z-index:90;max-width:min(92vw,520px);display:flex;align-items:center;gap:12px}
.toast button{color:var(--paper);font-weight:700;text-decoration:underline;padding:4px 10px}
.toast.solo{padding-right:18px}
.toast[hidden]{display:none}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;flex:none}
.busy{display:flex;align-items:center;gap:12px;margin:18px 0;font-weight:600}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.ringwrap .arc{transition:none}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pgrid button{display:block}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}
.pgrid .cap{font-size:12.5px;color:var(--mute);margin-top:3px;display:block}
.cover{box-shadow:0 0 0 2.5px var(--leaf);border-radius:12px}
.danger{color:var(--ink);font-weight:650;text-decoration:underline;text-underline-offset:3px}
.empty{padding:28px 0}
.empty .page{font-size:32px}
dl.need{margin:0;border-top:1px solid var(--line)}
dl.need div{padding:12px 0;border-bottom:1px solid var(--line)}
dl.need dt{font-size:14px;color:var(--mute)}
dl.need dd{margin:2px 0 0}
.have{color:var(--leaf);font-weight:650}
.prio{font-size:12.5px;font-weight:650;padding:2px 9px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--ink);white-space:nowrap}
.prio.now{background:var(--ink);color:var(--paper)}
.bought .t{text-decoration:line-through;color:var(--mute)}
.wx{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 12px 12px 16px;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--line);margin:4px 0 8px;font-size:15px}
.issue{padding:16px 0;border-bottom:1px solid var(--line)}
.issue:first-of-type{border-top:1px solid var(--line)}
.issue .ih{display:flex;align-items:center;gap:12px}
.issue .t{font-weight:650;display:block}
.issue .s{color:var(--mute);font-size:14px;display:block}
.issue p{margin:8px 0 0}
ul.log{list-style:none;margin:8px 0 0;padding:0;font-size:14px}
ul.log li{padding:2px 0}
</style>
</head>
<body>
<main id="main" class="app" aria-live="polite"></main>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button class="tab" data-act="nav" data-view="today"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5c3 4 6 7.3 6 10.5a6 6 0 0 1-12 0c0-3.2 3-6.5 6-10.5z"/></svg>Today</button>
    <button class="tab" data-act="nav" data-view="indoor"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></svg>Indoor</button>
    <button class="tab" data-act="nav" data-view="outdoor"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9.5" r="5.5"/><path d="M12 15v6M9 21h6"/></svg>Outdoor</button>
    <button class="tab" data-act="nav" data-view="calendar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Calendar</button>
    <button class="tab" data-act="nav" data-view="supplies"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>Supplies</button>
  </div>
</nav>

<section id="sheet" class="sheet" hidden role="dialog" aria-modal="true"><div class="in" id="sheetin"></div></section>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const dow = s => parse(s).getDay();
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const num = (x, max = 800) => Math.max(0, Math.min(max, Math.round(Number(x) || 0)));
const str = (x, n = 300) => (typeof x === 'string' ? x : x == null ? '' : String(x)).trim().slice(0, n);
const arr = x => Array.isArray(x) ? x : [];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WDL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const LABEL = {water:'Water', feed:'Feed', treat:'Treat', clean:'Clean leaves', refresh:'Repot', prune:'Prune', mow:'Mow'};
const GROUP = {water:'Water', feed:'Feed', treat:'Treat pests and disease', clean:'Clean leaves', mow:'Mow', prune:'Prune', refresh:'Repot and refresh'};
const DONE = {water:'Watered', feed:'Fed', treat:'Treated', clean:'Cleaned', refresh:'Done', prune:'Pruned', mow:'Mowed'};
const ORDER = ['water','feed','treat','clean','mow','prune','refresh'];
const PLAN_TYPES = ['water','feed','clean','mow','prune','refresh'];
const KINDI = {pest:'Pest', disease:'Disease', other:'Other problem'};
const KIND = {feed:'Feed', soil:'Potting soil', pot:'Pots', other:'Other'};
const ICON = {
  sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  cam:'<path d="M4 8h3.2l1.8-2.5h6L16.8 8H20v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  left:'<path d="M15 5l-7 7 7 7"/>',
  right:'<path d="M9 5l7 7-7 7"/>'
};
const ico = n => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
function fmtDay(s) {
  const d = diffDays(today(), s);
  if (d === 0) return 'Today';
  if (d === 1) return 'Tomorrow';
  if (d === -1) return 'Yesterday';
  if (d > 1 && d < 7) return WDL[dow(s)];
  const x = parse(s); return `${WD[x.getDay()]} ${x.getDate()} ${MON[x.getMonth()]}`;
}
function fmtRel(s) {
  const d = diffDays(today(), s);
  if (d < 0) return 'overdue';
  if (d === 0) return 'today';
  if (d === 1) return 'tomorrow';
  return 'on ' + fmtDay(s);
}
function longDate(s) { const x = parse(s); return `${x.getDate()} ${MONL[x.getMonth()]}`; }
const initial = p => esc((p.name || '?').trim().charAt(0).toUpperCase());

/* ---------- state ---------- */
const AI = false; // standalone build: no Claude runtime, so no AI features
const DEFAULTS = {careDays:[3,6], reminderTime:'07:30', hemisphere:'south', climate:'', pets:false, lat:null, lon:null};
const S = {settings:{...DEFAULTS}, plants:[], inventory:[], issues:[], rain:[], rainHold:null, autoHold:null, holdIgnored:null, wx:null, migrated:false, names:{}, me:null, canWrite:true, shopping:null, view:'today', calMonth:null, calSel:null, loaded:false, shopBusy:false, shopErr:''};
let sheet = null;      // {kind, ...}
let draft = null;      // add-plant draft
let pv = null;         // plant view state
let sup = null;        // supply draft
let setDraft = null;   // settings draft
let rd = null;         // rain sheet draft
let aiCtl = null;

/* ---------- storage ---------- */
const LKEY = 'tend-garden-v1';
const IDB = {
  db:null,
  open() { return new Promise((res, rej) => { const r = indexedDB.open('tend', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  get(k) { return new Promise((res, rej) => { const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  set(k, v) { return new Promise((res, rej) => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
};
const clean = o => JSON.parse(JSON.stringify(o));
// The garden lives at a shared path, so everyone the page is shared with (with edit access) sees and edits the same garden.
const Store = {
  mode:'local', db:null, user:null, base:'garden/main', priv:null, flags:{},
  async init() {
    let db = null, user = null;
    if (window.claude && typeof window.claude.use === 'function') {
      try { [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch (e) {}
    }
    if (db && user) {
      try {
        const id = await user.id();
        if (id) {
          this.db = db; this.user = user; S.me = id; this.priv = `data/users/${id}/garden`; this.mode = 'cloud';
          try { S.canWrite = user.can('data.write') !== false; } catch (e) {}
          this.subscribe(); return;
        }
      } catch (e) {}
    }
    this.mode = 'local'; await this.loadLocal(); S.loaded = true; render(); weatherSync();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  },
  mark(k) {
    this.flags[k] = true;
    if (!S.loaded && ['g','p','i','s'].every(x => this.flags[x])) { S.loaded = true; this.migrate(); }
    render(); loadNames();
  },
  subscribe() {
    const err = () => { toast('Couldn’t load the garden. Check your connection and reopen the page.'); };

/* ---------- weather ---------- */
// Past rainfall is logged automatically (5 mm+ soaking, 1-5 mm light). Forecast rain of 5 mm+ over the next 3 days holds outdoor watering.
let wxBusy = false;
async function weatherSync(force) {
  const st = S.settings;
  if (st.lat == null || st.lon == null || wxBusy || !navigator.onLine) return;
  if (!force && S.wx && Date.now() - S.wx.at < 3 * 3600e3) return;
  wxBusy = true;
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${st.lat}&longitude=${st.lon}&daily=precipitation_sum&past_days=3&forecast_days=4&timezone=auto`);
    if (!r.ok) throw new Error('weather');
    const j = await r.json();
    const days = j.daily.time, mm = j.daily.precipitation_sum, t = today();
    days.forEach((d, i) => {
      if (d >= t) return;
      const v = mm[i] || 0, id = 'auto-' + d;
      const amount = v >= 5 ? 'heavy' : v >= 1 ? 'light' : null;
      S.rain = S.rain.filter(x => x.id !== id);
      if (amount) S.rain.push({id, date:d, amount, mm:Math.round(v * 10) / 10, auto:true});
    });
    S.rain = S.rain.sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 40);
    const fc = days.map((d, i) => ({d, v:mm[i] || 0})).filter(x => x.d >= t && x.d <= addDays(t, 2));
    const total = Math.round(fc.reduce((a, x) => a + x.v, 0) * 10) / 10;
    const wet = fc.filter(x => x.v >= 2);
    S.wx = {at:Date.now(), total};
    S.autoHold = total >= 5 && wet.length ? {until:wet[wet.length - 1].d, mm:total} : null;
    await Store.putGarden();
  } catch (e) {} finally { wxBusy = false; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') weatherSync(); });

}

function renderToday() {
  const t = today();
  if (!S.plants.length) {
    return head('Tend', 'Photograph a plant and Tend works out what it is, what it needs and when, then batches the jobs onto the days you choose.', true) +
      `<div class="actions"><button class="btn" data-act="add" data-loc="indoor">${ico('cam')}Add an indoor plant</button><button class="btn ghost" data-act="add" data-loc="outdoor">Add an outdoor plant</button></div>

  }

  const hasNow = occ.some(o => o.date <= t);
  const focus = hasNow ? t : occ.reduce((m, o) => o.date < m ? o.date : m, occ[0].date);
  const list = occ.filter(o => o.date === focus);
  const doneToday = S.plants.reduce((n, p) => n + arr(p.history).filter(h => h.date === t).length, 0);
  const jobs = n => `${n} ${n === 1 ? 'job' : 'jobs'}`;

  if (focus !== t && doneToday) html += `<p class="note">${jobs(doneToday)} done today.</p>`;
  for (const type of ORDER) {
    const g = list.filter(o => o.task.type === type);

    g.sort((a, b) => (b.overdue - a.overdue) || a.plant.name.localeCompare(b.plant.name));
    html += `<h2 class="sec"><span>${GROUP[type]}</span>${g.length > 1 ? `<button class="link" data-act="doneall" data-type="${type}" data-date="${focus}">Mark all done</button>` : ''}</h2><ul class="rows">${g.map(rowHTML).join('')}</ul>`;
  }

function renderCalendar() {
  const t = today();

  const first = ymd(new Date(y, mo - 1, 1));
  const start = addDays(first, -((dow(first) + 6) % 7));
  const monthEnd = ymd(new Date(y, mo, 0));
  const end = monthEnd > addDays(t, 70) ? addDays(monthEnd, 7) : addDays(t, 70);
  const occ = projectAll(end);
  const by = {};
  occ.forEach(o => (by[o.date] = by[o.date] || []).push(o));
  const hist = {};
  S.plants.forEach(p => arr(p.history).forEach(h => (hist[h.date] = hist[h.date] || []).push({p, h})));
  S.issues.forEach(i => { const p = S.plants.find(x => x.id === i.plantId); if (p) arr(i.log).filter(l => l.type === 'treat').forEach(l => (hist[l.date] = hist[l.date] || []).push({p, h:{type:'treat', date:l.date, by:l.by, note:i.name}})); });
  const rainBy = {}; S.rain.forEach(r => (rainBy[r.date] = rainBy[r.date] || []).push(r));
  const sel = S.calSel || t;
  const cells = [];
  let d = start;
  const weeks = Math.ceil((diffDays(start, monthEnd) + 1) / 7);
  for (let i = 0; i < weeks * 7; i++, d = addDays(d, 1)) {
    const inM = d.slice(0, 7) === m;
    const list = d >= t ? (by[d] || []) : [];
    const past = d < t ? (hist[d] || []) : [];
    const types = new Set([...list.map(o => o.task.type), ...past.map(x => x.h.type)]);
    const dots = [...types].sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b)).slice(0, 3)
      .map(tp => `<span class="dot ${tp === 'water' ? 'water' : tp === 'feed' ? 'feed' : 'other'}${d < t ? ' past' : ''}"></span>`).join('');
    cells.push(`<button class="d${inM ? '' : ' out'}${isCare(d) ? ' care' : ''}${d === t ? ' today' : ''}${d === sel ? ' sel' : ''}" data-act="calday" data-date="${d}" aria-label="${esc(fmtDay(d))}${list.length ? ', ' + list.length + ' jobs' : ''}"><span>${parse(d).getDate()}</span><span class="dots">${dots}</span></button>`);
  }
  let html = `<div class="top"><div><h1 class="page">Calendar</h1><p class="sub">Shaded days are your care days. Jobs are batched onto them.</p></div><button class="iconbtn" data-act="settings" aria-label="Settings">${ico('sliders')}</button></div>
  <div class="monthbar"><button class="iconbtn" data-act="calmove" data-n="-1" aria-label="Previous month">${ico('left')}</button><strong>${MONL[mo - 1]} ${y}</strong><button class="iconbtn" data-act="calmove" data-n="1" aria-label="Next month">${ico('right')}</button></div>
  <div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w => `<span class="wd">${w}</span>`).join('')}${cells.join('')}</div>
  <div class="legend"><span><i class="dot water"></i>Water</span><span><i class="dot feed"></i>Feed</span><span><i class="dot other"></i>Repot, prune or mow</span></div>`;
  html += `<h2 class="sec"><span>${esc(fmtDay(sel))}</span></h2>`;
  if (sel < t) {
    const past = hist[sel] || [], rains = rainBy[sel] || [];
    html += rains.map(r => `<p class="note">${r.amount === 'heavy' ? 'Soaking rain' : 'Light rain'}${byWho(r.by)}.</p>`).join('');
    html += past.length ? `<ul class="rows">${past.map(({p, h}) => `<li class="row"><button class="main" data-act="open" data-id="${p.id}">${p.thumb ? `<img class="thumb" src="${p.thumb}" alt="">` : `<span class="thumb">${initial(p)}</span>`}<span class="txt"><span class="t">${esc(p.name)}</span><span class="s">${DONE[h.type]}${h.type === 'treat' ? ' for ' + esc(h.note) : ''}${byWho(h.by)}</span></span></button></li>`).join('')}</ul>` : (rains.length ? '' : `<p class="muted">Nothing was logged.</p>`);
  } else {
    const list = (by[sel] || []).sort((a, b) => ORDER.indexOf(a.task.type) - ORDER.indexOf(b.task.type));
    html += list.length ? ORDER.map(tp => { const g = list.filter(o => o.task.type === tp); return g.length ? `<h3 class="sec2" style="color:var(--ink)">${GROUP[tp]} <span class="muted" style="font-weight:500">(${g.length})</span></h3><ul class="rows">${g.map(rowHTML).join('')}</ul>` : ''; }).join('') : `<p class="muted">Nothing planned.</p>`;
  }

  return html;
}

async function runIdentify() {
  const d = draft; d.error = ''; d.busy = true; renderSheet();
  const sample = await getSample();
  if (!sample) { d.busy = false; d.error = 'Plant ID needs Claude, which isn’t available in this view. Fill in the care plan yourself, or open Tend from the Claude app.'; renderSheet(); return; }
  const imgsOK = d.shots.length && await canImages();
  if (d.shots.length && !imgsOK && !(d.hint.trim() || d.name.trim())) { d.busy = false; d.error = 'Photo analysis isn’t available here. Type what the plant is and try again.'; renderSheet(); return; }
  aiCtl = new AbortController();
  try {
    const opts = {signal:aiCtl.signal};
    if (imgsOK) opts.images = d.shots.map(s => dataUrlToBlob(s.full));
    const res = await sample.json(identifyPrompt({hasImages:!!imgsOK, loc:d.loc, spot:d.spot, name:d.name, hint:d.hint}), opts);
    if (!draft) return;
    d.result = normPlan(res); d.step = 2;
  } catch (e) { if (draft && e.code !== 'cancelled') d.error = errCopy(e); }
  finally { aiCtl = null; if (draft) { d.busy = false; renderSheet(); $('#sheet').scrollTop = 0; } }
}

function cadence(tk) {
  if (tk.type === 'refresh') return `Every ${Math.max(1, Math.round(tk.warmDays / 30))} months`;
  if (tk.type === 'clean') { const m = Math.max(1, Math.round(num(tk.warmDays) / 30)); return m === 1 ? `First ${WDL[cleanWd()]} of every month` : `First ${WDL[cleanWd()]} of every ${m === 2 ? 'second' : m + 'th'} month`; }
  const w = tk.warmDays, c = tk.coolDays, warm = isWarm(today());
  if (w === c) return `Every ${w} days`;
  const ws = w ? `every ${w} days` : 'paused', cs = c ? `every ${c} days` : 'paused';
  return warm ? `Now ${ws} (warm season), ${cs} in the cool season` : `Now ${cs} (cool season), ${ws} in the warm season`;
}
function supplyMatch(name) {

async function recheck() {
  const p = S.plants.find(x => x.id === pv.id); if (!p) return;

  pv.rebusy = true; pv.reerr = ''; renderSheet();
  aiCtl = new AbortController();
  try {
    const imgs = p.thumb && await canImages();
    const opts = {signal:aiCtl.signal};
    if (imgs) { const photos = pv.photos && pv.photos.length ? pv.photos.slice(0, 2).map(x => dataUrlToBlob(x.dataUrl)) : [dataUrlToBlob(p.thumb)]; opts.images = photos; }
    const res = await sample.json(identifyPrompt({hasImages:!!imgs, loc:p.location, spot:p.spot, name:p.name, hint:p.species || p.commonName}), opts);

    await save(() => Store.putPlant({...p, ...plan, name:p.name, planAt:Date.now()}), 'Care plan updated');
  } catch (e) { if (pv && e.code !== 'cancelled') pv.reerr = errCopy(e); }
  finally { aiCtl = null; if (pv) { pv.rebusy = false; renderSheet(); } }
}
async function healthCheck() {
  const p = S.plants.find(x => x.id === pv.id); if (!p) return;
  const h = pv.health;
  const sample = await getSample();
  if (!sample) { h.error = 'Claude isn’t available in this view.'; renderSheet(); return; }
  h.busy = true; h.error = ''; h.answer = ''; renderSheet();
  aiCtl = new AbortController();
  const imgs = h.shot && await canImages();
  const lines = arr(p.tasks).map(t => `${t.label}: warm season every ${t.warmDays} days, cool season every ${t.coolDays} days; last done ${(p.last || {})[t.type] || 'unknown'}`).join('\n');
  const prompt = `You are a plant doctor helping a home gardener.
Plant: ${p.name} (${p.species || p.commonName || 'species unknown'}), ${p.location}, ${p.spot || 'spot not given'}.
Current care plan:
${lines}
${ctxText()}
Problems logged for this plant: ${S.issues.filter(i => i.plantId === p.id).map(i => `${i.name} (${i.status === 'resolved' ? 'cleared' : 'active'}${i.treatment ? ', treated with ' + i.treatment : ''})`).join('; ') || 'none'}.
${imgs ? 'A photo of the problem is attached.' : ''}
What the user sees: "${h.text.trim() || 'see photo'}"
Reply in plain text, under 160 words. First line: the most likely cause. Then 2 to 4 short lines starting with "- " saying what to do now. Last line: whether the care plan should change, with new intervals in days if so. No headings, no bold.`;
  try {
    const opts = {signal:aiCtl.signal, cache:false, onText:({text}) => { if (pv) { pv.health.answer = text; const el = $('#sheet .note.pre'); if (el) el.textContent = text; else renderSheet(); } }};
    if (imgs) opts.images = [dataUrlToBlob(h.shot.full)];
    const {text} = await sample(prompt, opts);
    if (pv) h.answer = text;
  } catch (e) { if (pv && e.code !== 'cancelled') { h.error = errCopy(e); if (e.text) h.answer = e.text; } }
  finally { aiCtl = null; if (pv) { h.busy = false; renderSheet(); } }
}

/* calendar export */
function icsEsc(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
function fold(line) { const out = []; while (line.length > 73) { out.push(line.slice(0, 73)); line = ' ' + line.slice(73); } out.push(line); return out.join('\r\n'); }
function buildICS() {
  const t = today();
  const occ = projectAll(addDays(t, 56));
  const by = {}; occ.forEach(o => (by[o.date] = by[o.date] || []).push(o));
  const [hh, mm] = (S.settings.reminderTime || '07:30').split(':').map(Number);
  let em = mm + 30, eh = hh + Math.floor(em / 60); em %= 60; if (eh > 23) { eh = 23; em = 59; }
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Tend//Plant care//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Plant care'];
  for (const date of Object.keys(by).sort()) {
    const list = by[date]; const dd = date.replace(/-/g, '');
    const counts = ORDER.map(tp => [tp, list.filter(o => o.task.type === tp)]).filter(([, g]) => g.length);
    const summary = 'Plants: ' + counts.map(([tp, g]) => `${LABEL[tp].toLowerCase()} ${g.length}`).join(', ');
    const desc = counts.map(([tp, g]) => `${GROUP[tp]}: ${g.map(o => o.plant.name + (o.plant.spot ? ` (${o.plant.spot})` : '')).join(', ')}`).join('\n');
    L.push('BEGIN:VEVENT', `UID:${dd}-care@tend`, `DTSTAMP:${stamp}`, `DTSTART:${dd}T${pad(hh)}${pad(mm)}00`, `DTEND:${dd}T${pad(eh)}${pad(em)}00`,
      fold(`SUMMARY:${icsEsc(summary)}`), fold(`DESCRIPTION:${icsEsc(desc)}`),
      'BEGIN:VALARM', 'ACTION:DISPLAY', fold(`DESCRIPTION:${icsEsc(summary)}`), 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return {text:L.join('\r\n'), n:Object.keys(by).length};
}
async function saveFile(name, text, type) {
  const blob = new Blob([text], {type});
  try {
    const file = new File([blob], name, {type});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  return true;
}
async function exportICS() {
  if (!S.plants.length) { toast('Add a plant first.'); return; }
  const {text, n} = buildICS();
  if (await saveFile('plant-care.ics', text, 'text/calendar')) toast(`${n} care days exported. Open the file with your calendar app.`);
}

async function exportBackup() {
  const photos = Store.local.photos;
  const data = {app:'tend', version:1, exportedAt:new Date().toISOString(), settings:S.settings, shopping:S.shopping, rain:S.rain, rainHold:S.rainHold, plants:S.plants, inventory:S.inventory, issues:S.issues, photos};
  if (await saveFile(`tend-backup-${today()}.json`, JSON.stringify(data), 'application/json')) toast(`Backup ready: ${S.plants.length} plants, ${photos.length} photos`);
}
async function importBackup(file) {
  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { toast('That file isn’t a Tend backup.'); return; }
  if (!d || d.app !== 'tend' || !Array.isArray(d.plants)) { toast('That file isn’t a Tend backup.'); return; }
  if (!S.canWrite) { toast('You can view this garden but not change it.'); return; }
  toast('Restoring backup');
  await save(async () => {
    for (const p of d.plants) await Store.putPlant({...p});
    for (const i of arr(d.inventory)) await Store.putInv({...i});
    for (const i of arr(d.issues)) await Store.putIssue({...i});
    for (const ph of arr(d.photos)) await Store.addPhoto({...ph});
    if (d.settings) S.settings = {...DEFAULTS, ...d.settings, lat:S.settings.lat, lon:S.settings.lon};
    if (d.shopping) S.shopping = d.shopping;
    const seen = new Set(S.rain.map(r => r.id));
    S.rain = [...S.rain, ...arr(d.rain).filter(r => !seen.has(r.id))].sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 40);
    await Store.putGarden();
  }, `Restored ${d.plants.length} plants`);
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, undo) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" id="undo">Undo</button>' : ''}`;
  el.classList.toggle('solo', !undo);
  el.hidden = false; clearTimeout(toastTimer);
  if (undo) $('#undo').onclick = () => { el.hidden = true; undo(); };
  toastTimer = setTimeout(() => { el.hidden = true; }, undo ? 5000 : 3200);
}

/* ---------- actions ---------- */
async function markDone(ids, type, note) {
  const t = today(); const before = [];
  for (const id of ids) {
    const p = S.plants.find(x => x.id === id); if (!p) continue;
    before.push(p);
    const np = {...p, last:{...(p.last || {}), [type]:t}, history:[{type, date:t, note:note || '', by:S.me || ''}, ...arr(p.history)].slice(0, 60)};
    await save(() => Store.putPlant(np));
  }
  if (!before.length) return;
  const label = note === 'rain' ? `Logged rain for ${before.length} ${before.length === 1 ? 'plant' : 'plants'}` : before.length === 1 ? `${DONE[type]} ${before[0].name}` : `${DONE[type]} ${before.length} plants`;
  toast(label, async () => { for (const p of before) await save(() => Store.putPlant({...p})); });
}
async function markTreated(ids) {
  const t = today(), before = [];
  for (const id of ids) {
    const i = S.issues.find(x => x.id === id); if (!i) continue;
    before.push(i);
    await save(() => Store.putIssue({...i, lastTreated:t, log:[{type:'treat', date:t, note:'Treated' + (i.treatment ? ': ' + i.treatment : ''), by:S.me || ''}, ...arr(i.log)].slice(0, 30)}));
  }
  if (!before.length) return;
  toast(before.length === 1 ? `Treated ${before[0].name}` : `Treated ${before.length} problems`, async () => { for (const i of before) await save(() => Store.putIssue({...i})); });
}
function bindTarget() {
  if (!sheet) return null;
  if (sheet.kind === 'add') return draft;
  if (sheet.kind === 'supply') return sup;
  if (sheet.kind === 'settings') return setDraft;
  if (sheet.kind === 'rain') return rd;
  if (sheet.kind === 'plant' && pv && pv.issueForm) return pv.issueForm;
  if (sheet.kind === 'plant' && pv && pv.editing) return pv.edit;
  return null;
}
function onInput(e) {
  const el = e.target;
  if (el.dataset.bind) { const t = bindTarget(); if (t) t[el.dataset.bind] = el.value; if (sheet && sheet.kind === 'add' && draft.step === 1 && e.type === 'input') { const b = $('[data-act="identify"]'); if (b) b.disabled = !(draft.shots.length || draft.hint.trim() || draft.name.trim()); } }
  if (el.dataset.tb) {
    const tasks = sheet.kind === 'add' ? draft.result.tasks : pv.edit.tasks;
    const [i, f] = el.dataset.tb.split(':'); const tk = tasks[+i]; if (!tk) return;
    if (f === 'months') { const m = Math.max(1, num(el.value, 120)); tk.warmDays = tk.coolDays = m * 30; }
    else tk[f] = num(el.value, 400);
  }
  if (el.dataset.up && pv) pv.upd[el.dataset.up] = el.value;
  if (el.dataset.hb && pv) { pv.health[el.dataset.hb] = el.value; const b = $('[data-act="health"]'); if (b) b.disabled = !(el.value.trim() || pv.health.shot); }
  if (el.dataset.pn && pv) {
    const p = S.plants.find(x => x.id === pv.id);
    const was = pv.notes !== null && pv.notes !== ((p && p.notes) || '');
    pv.notes = el.value;
    const now = pv.notes !== ((p && p.notes) || '');
    if (was !== now && e.type === 'change') renderSheet();
    else if (!was && now && !$('[data-act="savenotes"]')) { el.insertAdjacentHTML('afterend', `<div class="actions"><button class="btn small" data-act="savenotes">Save notes</button></div>`); }
  }
}
document.addEventListener('input', onInput);
document.addEventListener('change', onInput);

document.addEventListener('change', async e => {
  const el = e.target; if (!el.dataset.file || !el.files || !el.files[0]) return;
  const file = el.files[0]; el.value = '';
  try {
    if (el.dataset.file === 'scan') { await scanLabel(file); return; }
    if (el.dataset.file === 'restore') { await importBackup(file); return; }
    const ph = await processPhoto(file);
    if ((el.dataset.file === 'addshot' || el.dataset.file === 'reshot') && draft) {
      if (draft.shots.length >= 3) draft.shots.pop();
      draft.shots.push(ph);
      if (!AI) { if (draft.step === 1) { draft.result = manualPlan(''); draft.step = 2; } renderSheet(); }
      else if (!draft.busy) runIdentify(); else renderSheet();
    }
    if (el.dataset.file === 'healthshot' && pv) { pv.health.shot = ph; renderSheet(); }
    if (el.dataset.file === 'issueshot' && pv && pv.issueForm) { pv.issueForm.thumb = ph.thumb; renderSheet(); }
    if (el.dataset.file === 'plantphoto' && pv) {
      const p = S.plants.find(x => x.id === pv.id); if (!p) return;
      const rec = {id:newId(), plantId:p.id, dataUrl:ph.full, thumbOf:ph.thumb, takenAt:Date.now()};
      pv.photos = [rec, ...(pv.photos || [])];
      await save(async () => { await Store.addPhoto(rec); await Store.putPlant({...p, thumb:ph.thumb}); }, 'Photo added');
    }
  } catch (err) { toast('That photo couldn’t be opened. Try another.'); }
});

const ACT = {
  nav:b => { S.view = b.dataset.view; render(); window.scrollTo(0, 0); },
  settings:() => { setDraft = {...S.settings, careDays:[...careDays()]}; openSheet({kind:'settings'}); },
  close:() => closeSheet(),
  add:b => openAdd(b.dataset.loc || (S.view === 'outdoor' ? 'outdoor' : 'indoor')),
  open:b => openPlant(b.dataset.id),
  done:b => b.dataset.issue ? markTreated([b.dataset.issue]) : markDone([b.dataset.id], b.dataset.type),
  doneall:b => {
    const occ = projectAll(b.dataset.date).filter(o => o.date === b.dataset.date && o.task.type === b.dataset.type);
    if (b.dataset.type === 'treat') markTreated([...new Set(occ.map(o => o.task.issue.id))]);
    else markDone([...new Set(occ.map(o => o.plant.id))], b.dataset.type);
  },
  rainsheet:() => { rd = {when:'0', amount:'heavy', hold:'2'}; openSheet({kind:'rain'}); },
  lograin:async () => {
    const ev = {id:newId(), date:addDays(today(), -(+rd.when)), amount:rd.amount, by:S.me || ''};
    const prev = S.rain.slice();
    S.rain = [ev, ...S.rain].sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 40);
    closeSheet();
    await save(() => Store.putGarden());
    toast(`${ev.amount === 'heavy' ? 'Soaking' : 'Light'} rain logged`, () => { S.rain = prev; save(() => Store.putGarden()); });
  },
  delrain:b => { S.rain = S.rain.filter(r => r.id !== b.dataset.id); save(() => Store.putGarden()); renderSheet(); },
  sethold:async () => { S.rainHold = {until:addDays(today(), (+rd.hold) - 1), by:S.me || ''}; closeSheet(); await save(() => Store.putGarden(), 'Outdoor watering on hold'); },
  cancelhold:async () => { S.rainHold = null; await save(() => Store.putGarden(), 'Hold cancelled'); renderSheet(); },
  newissue:() => { pv.issueForm = {id:null, kind:'pest', name:'', notes:'', treatment:'', repeatDays:'0', treatedToday:'yes', thumb:'', error:''}; renderSheet(); },
  editissue:b => { const i = S.issues.find(x => x.id === b.dataset.id); if (!i) return; pv.issueForm = {id:i.id, kind:i.kind || 'pest', name:i.name, notes:i.notes || '', treatment:i.treatment || '', repeatDays:String(num(i.repeatDays)), thumb:i.thumb || '', error:'', del:false}; renderSheet(); },
  cancelissue:() => { pv.issueForm = null; renderSheet(); },
  rmishot:() => { pv.issueForm.thumb = ''; renderSheet(); },
  saveissue:async () => {
    const f = pv.issueForm, t = today();
    if (!f.name.trim()) { f.error = 'Name the problem first, even roughly.'; renderSheet(); return; }
    const old = f.id ? S.issues.find(x => x.id === f.id) : null;
    const it = old ? {...old} : {id:newId(), plantId:pv.id, startedAt:t, status:'active', by:S.me || '', log:[], lastTreated:f.treatedToday === 'yes' ? t : null};
    Object.assign(it, {kind:f.kind, name:f.name.trim(), notes:f.notes.trim(), treatment:f.treatment.trim(), repeatDays:num(f.repeatDays, 90), thumb:f.thumb || ''});
    pv.issueForm = null;
    await save(() => Store.putIssue(it), old ? 'Problem updated' : 'Problem logged');
    renderSheet();
  },
  delissue:async () => { const f = pv.issueForm; if (!f.del) { f.del = true; renderSheet(); return; } pv.issueForm = null; await save(() => Store.delIssue(f.id), 'Problem deleted'); renderSheet(); },
  treated:b => markTreated([b.dataset.id]),
  resolve:async b => { const i = S.issues.find(x => x.id === b.dataset.id); if (!i) return; await save(() => Store.putIssue({...i, status:'resolved', resolvedAt:today()})); toast(`${i.name} cleared`, () => save(() => Store.putIssue({...i}))); },
  reopen:b => { const i = S.issues.find(x => x.id === b.dataset.id); if (i) save(() => Store.putIssue({...i, status:'active', resolvedAt:null})); },
  toggleresolved:() => { pv.showResolved = !pv.showResolved; renderSheet(); },
  addupd:async b => {
    const i = S.issues.find(x => x.id === b.dataset.id); const note = (pv.upd[b.dataset.id] || '').trim(); if (!i || !note) return;
    pv.upd[b.dataset.id] = '';
    await save(() => Store.putIssue({...i, log:[{type:'note', date:today(), note, by:S.me || ''}, ...arr(i.log)].slice(0, 30)}));
    renderSheet();
  },
  loghealth:() => {
    const h = pv.health; const lines = h.answer.split('\n').map(x => x.trim()).filter(Boolean);
    const name = (lines[0] || '').replace(/^(most )?likely cause:?\s*/i, '').replace(/[.]$/, '').slice(0, 80);
    const treatment = lines.filter(l => l.startsWith('- ')).map(l => l.slice(2)).join('; ').slice(0, 240);
    pv.issueForm = {id:null, kind:/fung|mildew|rot|blight|rust|spot|virus|bacter/i.test(h.answer) ? 'disease' : /mite|aphid|mealy|scale|thrip|snail|slug|caterpillar|whitefl|gnat|bug|insect|pest/i.test(h.answer) ? 'pest' : 'other', name, notes:h.text.trim(), treatment, repeatDays:'0', treatedToday:'no', thumb:h.shot ? h.shot.thumb : '', error:''};
    renderSheet();
    setTimeout(() => { const el = $('#sheet [data-act="saveissue"]'); if (el) el.scrollIntoView({block:'center'}); }, 30);
  },
  set:b => {
    const t = bindTarget(); if (!t) return;
    const k = b.dataset.k, v = b.dataset.v;
    if (k === 'pets' || k === 'low') t[k] = v === 'yes'; else t[k] = v;
    renderSheet();
  },
  careday:b => { const d = +b.dataset.d; const c = setDraft.careDays; const i = c.indexOf(d); if (i >= 0) c.splice(i, 1); else c.push(d); c.sort(); renderSheet(); },
  savesettings:async () => { S.settings = {...S.settings, ...setDraft}; if (S.settings.lat == null) S.autoHold = null; closeSheet(); await save(() => Store.putGarden(), 'Settings saved'); weatherSync(true); },
  identify:() => runIdentify(),
  stop:() => { if (aiCtl) aiCtl.abort(); },
  manual:() => { draft.result = manualPlan(draft.name || draft.hint); draft.step = 2; renderSheet(); $('#sheet').scrollTop = 0; },
  alt:b => { draft.hint = b.dataset.v; runIdentify(); },
  typename:() => { draft.typeName = true; renderSheet(); setTimeout(() => { const el = $('#sheet [data-bind="hint"]'); if (el) el.focus(); }, 30); },
  addback:() => { draft.step = 1; renderSheet(); },
  rmshot:b => { draft.shots.splice(+b.dataset.i, 1); renderSheet(); },
  saveplant:() => savePlant(),
  pdone:b => { if (b.dataset.issue) markTreated([b.dataset.issue]); else markDone([pv.id], b.dataset.type); },
  edit:() => { const p = S.plants.find(x => x.id === pv.id); pv.editing = true; pv.edit = {name:p.name, location:p.location, exposed:p.exposed === false ? 'no' : 'yes', spot:p.spot || '', tasks:clean(arr(p.tasks))}; renderSheet(); },
  canceledit:() => { pv.editing = false; renderSheet(); },
  saveedit:async () => { const p = S.plants.find(x => x.id === pv.id); const e = pv.edit; pv.editing = false; await save(() => Store.putPlant({...p, name:e.name.trim() || p.name, location:e.location, exposed:e.location === 'outdoor' && e.exposed !== 'no', spot:e.spot.trim(), tasks:e.tasks, planAt:Date.now()}), 'Plan saved'); renderSheet(); },
  recheck:() => recheck(),
  cover:async b => { const p = S.plants.find(x => x.id === pv.id); const ph = (pv.photos || []).find(x => x.id === b.dataset.pid); if (!p || !ph) return; const th = ph.thumbOf || await shrinkSrc(ph.dataUrl, 360, 0.78); await save(() => Store.putPlant({...p, thumb:th}), 'Main photo updated'); },
  rmhshot:() => { pv.health.shot = null; renderSheet(); },
  health:() => healthCheck(),
  savehealth:async () => { const p = S.plants.find(x => x.id === pv.id); const n = `${fmtDay(today())}: ${pv.health.text.trim()}\n${pv.health.answer.trim()}`; const notes = (p.notes ? p.notes + '\n\n' : '') + n; pv.notes = null; await save(() => Store.putPlant({...p, notes}), 'Saved to notes'); },
  savenotes:async () => { const p = S.plants.find(x => x.id === pv.id); const notes = pv.notes; pv.notes = null; await save(() => Store.putPlant({...p, notes}), 'Notes saved'); },
  delplant:async () => { if (!pv.del) { pv.del = true; renderSheet(); return; } const id = pv.id; const name = (S.plants.find(x => x.id === id) || {}).name; closeSheet(); await save(() => Store.delPlant(id), `${name || 'Plant'} deleted`); },
  supply:b => openSupply(b.dataset.id),
  savesupply:async () => {
    if (!sup.name.trim()) { sup.error = 'Give it a name first.'; renderSheet(); return; }
    const it = {id:sup.id || newId(), name:sup.name.trim(), kind:sup.kind, details:sup.details.trim(), low:!!sup.low};
    closeSheet(); await save(() => Store.putInv(it), 'Supplies updated');
  },
  delsupply:b => { const it = S.inventory.find(x => x.id === b.dataset.id); if (!it) return; save(() => Store.delInv(it.id)); toast(`Removed ${it.name}`, () => save(() => Store.putInv({...it}))); },
  shop:() => makeShopping(),
  bought:b => { const it = S.shopping.buy[+b.dataset.i]; if (!it) return; it.bought = !it.bought; save(() => Store.putGarden()); },
  tosupply:b => { const it = S.shopping.buy[+b.dataset.i]; if (!it) return; sup = {id:null, name:it.item, kind:/soil|mix|compost/i.test(it.item) ? 'soil' : /pot\b|pots|planter/i.test(it.item) ? 'pot' : /feed|fertili|food|npk/i.test(it.item) ? 'feed' : 'other', details:'', low:false, busy:false, error:''}; openSheet({kind:'supply'}); },
  calday:b => { S.calSel = b.dataset.date; render(); },
  calmove:b => { const m = S.calMonth || today().slice(0, 7); const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + (+b.dataset.n), 1); S.calMonth = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; render(); },
  ics:() => exportICS(),
  backup:() => exportBackup(),
  ignorehold:async () => { if (S.autoHold) S.holdIgnored = S.autoHold.until; await save(() => Store.putGarden(), 'Forecast ignored'); renderSheet(); },
  geoloc:() => {
    if (!navigator.geolocation) { toast('Location isn’t available on this phone.'); return; }
    toast('Finding your location');
    navigator.geolocation.getCurrentPosition(pos => {
      if (!setDraft) return;
      setDraft.lat = Math.round(pos.coords.latitude * 100) / 100; setDraft.lon = Math.round(pos.coords.longitude * 100) / 100;
      renderSheet(); toast('Location found. Tap Save settings to turn it on.');
    }, () => toast('Couldn’t get your location. Allow location access for Tend and try again.'), {timeout:15000, maximumAge:600000});
  },
  geooff:() => { setDraft.lat = null; setDraft.lon = null; renderSheet(); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if (fn) { e.preventDefault(); fn(b, e); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet) closeSheet(); });

/* ---------- boot ---------- */
render();
Store.init();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
